# CI for gwm-reader: lint, tests, dependency audit, secret scan, image build
# with its digest in the job summary, and an SBOM artifact. It never pushes
# an image or any other artifact to a registry, and it never contacts GWM.
name: ci

on:
  push:
    branches: [hardened]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: haval-h6-mqtt

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: haval-h6-mqtt/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --log-opts=--all --redact --no-banner --exit-code 1

  image:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Build the image (no push)
        run: docker build --pull -t gwm-reader:ci .
      - name: Image digest
        run: |
          id="$(docker image inspect gwm-reader:ci --format '{{.Id}}')"
          {
            echo "### gwm-reader image"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| image id (config digest) | \`$id\` |"
            echo "| commit | \`$GITHUB_SHA\` |"
            echo "| pushed to a registry | no |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "image id: $id"
      - name: Image runs as non-root without a shell
        run: |
          test "$(docker image inspect gwm-reader:ci --format '{{.Config.User}}')" = "65532:65532"
          ! docker run --rm --entrypoint /bin/sh gwm-reader:ci -c true 2>/dev/null
      - name: docker compose config
        run: |
          ./scripts/init-secrets.sh
          docker compose -p gwm-reader config -q

  integration:
    # The compose stack with a mock GWM behind Squid (project gwm-reader-it):
    # Mosquitto ACL, the no-direct-route proof and the end-to-end flow.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: haval-h6-mqtt/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run test:integration

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "24"}
      - run: npm ci --omit=dev --ignore-scripts --no-fund
      - name: CycloneDX SBOM (production dependencies)
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: haval-h6-mqtt/sbom.cdx.json
          if-no-files-found: error
