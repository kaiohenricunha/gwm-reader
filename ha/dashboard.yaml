          type: vertical-stack
          cards:
            - type: custom:stack-in-card
              mode: horizontal
              cards:
                - type: custom:stack-in-card
                  mode: vertical
                  keep:
                    background: false
                    box_shadow: false
                    border_radius: false
                    margin: false
                    outer_padding: false
                  card_mod:
                    style: |
