  - type: panel
    path: controles
    title: Controles
    icon: mdi:camera-control
    cards:
      - type: custom:config-template-card
        entities:
          - binary_sensor.gwmbrasil_h6_estado_da_trava
          - binary_sensor.gwmbrasil_h6_estado_do_ar_condicionado
          - binary_sensor.gwmbrasil_h6_estado_do_purificador_de_ar
          - binary_sensor.gwmbrasil_h6_porta_dianteira_direita
          - binary_sensor.gwmbrasil_h6_porta_dianteira_esquerda
          - binary_sensor.gwmbrasil_h6_porta_malas
          - binary_sensor.gwmbrasil_h6_porta_traseira_direita
          - binary_sensor.gwmbrasil_h6_porta_traseira_esquerda
          - sensor.gwmbrasil_h6_estado_do_motor
          - sensor.gwmbrasil_h6_status_message
          - sensor.gwmbrasil_h6_posicao_do_teto_solar
          - sensor.gwmbrasil_h6_vidro_dianteiro_direito
          - sensor.gwmbrasil_h6_vidro_dianteiro_esquerdo
          - sensor.gwmbrasil_h6_vidro_traseiro_direito
          - sensor.gwmbrasil_h6_vidro_traseiro_esquerdo
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: |
                {% set raw = states('sensor.gwmbrasil_h6_status_message') %}          {% if raw in ['unknown','unavailable','', None] %}
                  {% set mensagens = [] %}
                {% else %}
                  {% set mensagens = raw.split('|') %}
                {% endif %}
                {% set textos = {
                  "NO_ALERTS": "Não há alertas neste momento.",
                  "ERR_FORMATTING_ADDRESS": "Erro ao formatar endereço.",
                  "ERR_GENERATE_RESPONSE": "Desculpe, houve um erro ao gerar a resposta.",
                  "ALERT_HIGH_VOLTAGE_DISCONNECT": "A bateria de alta tensão já está totalmente carregada. O carregador deve ser desconectado.",
                  "SUNROOF_OPEN": "O teto solar está aberto.",
                  "UNLOCKED": "A trava das portas não está acionada e o veículo pode ser aberto.",
                  "ENGINE_ON_AND_UNLOCKED": "O motor está ligado e o veículo está destravado. Verifique se não foi esquecido ligado.",
                  "FUEL_LOW": "Nível de combustível abaixo de 15 litros. Recomenda-se abastecer.",
                  "AC_ON_WITH_ENGINE_OFF": "O ar-condicionado está ligado com o veículo desligado. Isso pode drenar a bateria de 12V.",
                  "REVIEW_PREFIX": "Seu veículo está dentro do limite padrão de quilometragem para agendar a revisão."
                } %}
                {% for item in mensagens %}
                  {% set partes = item.split('@') %}
                  {% set codigo = partes[0] | trim %}
                  {% if codigo in textos %}
                  • {{ textos.get(codigo) }}
                  {% elif codigo == 'VEHICLE_CHARGING_TIME' and partes|length >= 2 %}
                  • O veículo está carregando. Tempo aproximado para carga total: {{ partes[1] }}.
                  {% elif codigo == 'WINDOW_OPEN' and partes|length >= 2 %}
                  • O {{ partes[1] }} está aberto.
                  {% elif codigo == 'DOOR_OPEN' and partes|length >= 2 %}
                  • A {{ partes[1] }} está aberta.
                  {% elif codigo == 'TRUNK_OPEN' and partes|length >= 2 %}
                  • O {{ partes[1] }} está aberto.
                  {% elif codigo == 'BATTERY_12V_CRITICAL' and partes|length >= 2 %}
                  • 🔴 Alerta crítico: bateria 12V em {{ partes[1] }}%. Ligue o motor o quanto antes.
                  {% elif codigo == 'BATTERY_12V_ALERT' and partes|length >= 2 %}
                  • 🟠 Atenção: bateria 12V em {{ partes[1] }}%.
                  {% elif codigo == 'TIRE_PRESSURE' and partes|length >= 4 %}
                  • A {{ partes[1] }} está em {{ partes[2] }} psi com temperatura de {{ partes[3] }}.
                  {% elif codigo == 'TIRE_PRESSURE_DEFAULTS' and partes|length >= 3 %}
                  • A pressão recomendada pela montadora é entre {{ partes[1] }} e {{ partes[2] }} psi.
                  {% elif codigo == 'SERVICE_WITH_TOLERANCE' and partes|length >= 2 %}
                  • Veículo no limite para revisão. Restam {{ partes[1] }} km antes da perda da garantia.
                  {% else %}
                  • {{ item }}
                  {% endif %}

                {% endfor %}
              card_mod:
                style: |
                  ha-card {
                    background: rgba(30, 35, 45, 0.4);
                    backdrop-filter: blur(20px);
                    border-radius: 6px;
                    padding: 16px;
                    color: rgba(255,255,255,0.7);
                    font-size: 14px;
                    text-align: center;
                    display: {% if states('sensor.gwmbrasil_h6_status_message') in
                      ['NO_ALERTS','Não há alertas neste momento.','unknown','unavailable',''] %}
                      none
                    {% else %}
                      block
                    {% endif %} !important;
                  }
            - type: custom:button-card
              name: MOTOR
              show_icon: false
              show_name: true
              show_state: false
              entity: sensor.gwmbrasil_h6_estado_do_motor
              styles:
                card:
                  - background: transparent
                  - box-shadow: none
                  - padding: 8px 8px 0 8px
                name:
                  - font-size: 11px
                  - font-weight: "500"
                  - letter-spacing: 1px
                  - color: rgba(255,255,255,0.4)
                  - justify-self: start
                grid:
                  - grid-template-areas: '"n status"'
                  - grid-template-columns: 1fr auto
              custom_fields:
                status: |
                  [[[            
                    const status = states[`sensor.gwmbrasil_h6_estado_do_motor`].state;
                    if (status === 'none') return '';
                    const isOn = status === '1';
                    const color = isOn ? '#f87171' : '#4ade80';
                    const text = isOn ? 'Ligado' : 'Desligado';
                    return `<span style="display:flex;align-items:center;gap:6px;">
                      <span style="width:6px;height:6px;border-radius:50%;background:${color};animation:pulse 2s infinite;"></span>
                      <span style="font-size:11px;color:${color};">${text}</span>
                    </span>`;
                  ]]]
            - type: horizontal-stack
              cards: []
            - type: custom:button-card
              name: PORTAS
              show_icon: false
              entity: binary_sensor.gwmbrasil_h6_estado_da_trava
              styles:
                card:
                  - background: transparent
                  - box-shadow: none
                  - padding: 16px 8px 0 8px
                name:
                  - font-size: 11px
                  - font-weight: "500"
                  - letter-spacing: 1px
                  - color: rgba(255,255,255,0.4)
                  - justify-self: start
                grid:
                  - grid-template-areas: '"n status"'
                  - grid-template-columns: 1fr auto
              custom_fields:
                status: |
                  [[[
                    const status = states[`binary_sensor.gwmbrasil_h6_estado_da_trava`].state;
                    if (status === 'none') return '';
                    const isOpen = status === 'on';
                    const color = isOpen ? '#f87171' : '#4ade80';
                    const text = isOpen ? 'Abertas' : 'Fechadas';
                    return `<span style="display:flex;align-items:center;gap:6px;">
                      <span style="width:6px;height:6px;border-radius:50%;background:${color};animation:pulse 2s infinite;"></span>
                      <span style="font-size:11px;color:${color};">${text}</span>
                    </span>`;
                  ]]]
            - type: horizontal-stack
              cards: []
            - type: custom:button-card
              name: PORTA-MALAS
              show_icon: false
              entity: binary_sensor.gwmbrasil_h6_porta_malas
              styles:
                card:
                  - background: transparent
                  - box-shadow: none
                  - padding: 16px 8px 0 8px
                name:
                  - font-size: 11px
                  - font-weight: "500"
                  - letter-spacing: 1px
                  - color: rgba(255,255,255,0.4)
                  - justify-self: start
                grid:
                  - grid-template-areas: '"n status"'
                  - grid-template-columns: 1fr auto
              custom_fields:
                status: |
                  [[[
                    const status = states[`binary_sensor.gwmbrasil_h6_porta_malas`].state;
                    if (status === 'none') return '';
                    const isOpen = status === 'on';
                    const color = isOpen ? '#f87171' : '#4ade80';
                    const text = isOpen ? 'Aberto' : 'Fechado';
                    return `<span style="display:flex;align-items:center;gap:6px;">
                      <span style="width:6px;height:6px;border-radius:50%;background:${color};animation:pulse 2s infinite;"></span>
                      <span style="font-size:11px;color:${color};">${text}</span>
                    </span>`;
                  ]]]
            - type: horizontal-stack
              cards: []
            - type: custom:button-card
              name: VIDROS
              show_icon: false
              entity: sensor.gwmbrasil_h6_vidro_dianteiro_esquerdo
              tap_action:
                action: none
              hold_action:
                action: none
              styles:
                card:
                  - background: transparent
                  - box-shadow: none
                  - padding: 16px 8px 0 8px
                name:
                  - font-size: 11px
                  - font-weight: "500"
                  - letter-spacing: 1px
                  - color: rgba(255,255,255,0.4)
                  - justify-self: start
                grid:
                  - grid-template-areas: '"n status"'
                  - grid-template-columns: 1fr auto
              custom_fields:
                status: |
                  [[[
                    const sensors = [
                      `sensor.gwmbrasil_h6_vidro_dianteiro_esquerdo`,
                      `sensor.gwmbrasil_h6_vidro_dianteiro_direito`,
                      `sensor.gwmbrasil_h6_vidro_traseiro_esquerdo`,
                      `sensor.gwmbrasil_h6_vidro_traseiro_direito`
                    ];

                    const values = sensors
                      .map(e => states[e]?.state)
                      .filter(v => v !== undefined && v !== 'none');

                    if (values.length === 0) return '';

                    const anyOpen = values.some(v => v !== '1');

                    const color = anyOpen ? '#f87171' : '#4ade80';
                    const text  = anyOpen ? 'Abertos' : 'Fechados';

                    return `
                      <span style="display:flex;align-items:center;gap:6px;">
                        <span style="
                          width:6px;
                          height:6px;
                          border-radius:50%;
                          background:${color};
                          animation:pulse 2s infinite;
                        "></span>
                        <span style="font-size:11px;color:${color};">
                          ${text}
                        </span>
                      </span>
                    `;
                  ]]]
            - type: horizontal-stack
              cards: []
            - type: custom:button-card
              name: TETO SOLAR
              show_icon: false
              entity: sensor.gwmbrasil_h6_posicao_do_teto_solar
              styles:
                card:
                  - background: transparent
                  - box-shadow: none
                  - padding: 16px 8px 0 8px
                name:
                  - font-size: 11px
                  - font-weight: "500"
                  - letter-spacing: 1px
                  - color: rgba(255,255,255,0.4)
                  - justify-self: start
                grid:
                  - grid-template-areas: '"n status"'
                  - grid-template-columns: 1fr auto
              custom_fields:
                status: |
                  [[[
                    const status = states[`sensor.gwmbrasil_h6_posicao_do_teto_solar`].state;
                    if (status === 'none') return '';
                    const isOpen = status !== '3';
                    const color = isOpen ? '#f87171' : '#4ade80';
                    const text = isOpen ? 'Aberto' : 'Fechado';
                    return `<span style="display:flex;align-items:center;gap:6px;">
                      <span style="width:6px;height:6px;border-radius:50%;background:${color};animation:pulse 2s infinite;"></span>
                      <span style="font-size:11px;color:${color};">${text}</span>
                    </span>`;
                  ]]]
            - type: horizontal-stack
              cards: []
    subview: true
    layout: {}
