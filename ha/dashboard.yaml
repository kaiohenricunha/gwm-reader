                              state: "${ states['sensor.gwmbrasil_h6_vidro_dianteiro_esquerdo'].state === '1' ? 'Fechado' : states['sensor.gwmbrasil_h6_vidro_dianteiro_esquerdo'].state === '2' ? 'Aberto' : states['sensor.gwmbrasil_h6_vidro_dianteiro_esquerdo'].state === '3' ? 'Entreaberto' : 'Desconhecido' }"
                            - type: custom:template-entity-row
