# Read-only Home Assistant dashboard for gwm-reader, derived from upstream
# files/HomeAssistant_Dashboard_GWM.yaml (havaleiros, MIT) by
# removing every button, switch, select, service call, the map/device
# tracker, the address sensor, the GWM iframe and the GWM image URL.
# Entity ids use VEHICLE_ID=h6; replace "gwmbrasil_h6_" if you chose another id.
title: Haval H6 Dashboard
views:
  - type: panel
    path: gwm-dashboard
    title: GWM Dashboard
    icon: mdi:car-electric
    cards:
      - type: custom:config-template-card
        entities:
          - binary_sensor.gwmbrasil_h6_agendamento_de_carga
