                              state: "${ states['sensor.gwmbrasil_h6_vidro_dianteiro_direito'].state === '1' ? 'Fechado' : states['sensor.gwmbrasil_h6_vidro_dianteiro_direito'].state === '2' ? 'Aberto' : states['sensor.gwmbrasil_h6_vidro_dianteiro_direito'].state === '3' ? 'Entreaberto' : 'Desconhecido' }"
                            - type: custom:template-entity-row
                              entity: sensor.gwmbrasil_h6_vidro_traseiro_esquerdo
                              name: Traseiro esquerdo
                              color: "${ states['sensor.gwmbrasil_h6_vidro_traseiro_esquerdo'].state !== '1' ? 'red' : '' }"
                              state: "${ states['sensor.gwmbrasil_h6_vidro_traseiro_esquerdo'].state === '1' ? 'Fechado' : states['sensor.gwmbrasil_h6_vidro_traseiro_esquerdo'].state === '2' ? 'Aberto' : states['sensor.gwmbrasil_h6_vidro_traseiro_esquerdo'].state === '3' ? 'Entreaberto' : 'Desconhecido' }"
                            - type: custom:template-entity-row
                              entity: sensor.gwmbrasil_h6_vidro_traseiro_direito
                              name: Traseiro direito
                              color: "${ states['sensor.gwmbrasil_h6_vidro_traseiro_direito'].state !== '1' ? 'red' : '' }"
                              state: "${ states['sensor.gwmbrasil_h6_vidro_traseiro_direito'].state === '1' ? 'Fechado' : states['sensor.gwmbrasil_h6_vidro_traseiro_direito'].state === '2' ? 'Aberto' : states['sensor.gwmbrasil_h6_vidro_traseiro_direito'].state === '3' ? 'Entreaberto' : 'Desconhecido' }"
                          card_mod:
                            style: |
                              ha-card {
                                background: none !important /*bg*/;
                                border-radius: 6px;
                              }
                        - type: entities
                          entities:
                            - type: custom:template-entity-row
                              entity: sensor.gwmbrasil_h6_posicao_do_teto_solar
                              name: Teto Solar
                              state: "${ states['sensor.gwmbrasil_h6_posicao_do_teto_solar'].state === '3' ? 'Fechado' : 'Aberto'}"
                            - type: custom:bar-card
                              entity: sensor.gwmbrasil_h6_posicao_do_teto_solar
                              name: Teto Solar
                              tap_action:
                                action: none
                              hold_action:
                                action: none
