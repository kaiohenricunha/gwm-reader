# Mosquitto for gwm-reader. It listens only inside the internal Docker
# network; no host port is published. Every client authenticates and the
# ACL limits each user to its own topics.
listener 1883
protocol mqtt
allow_anonymous false
# The broker uses each client's username as its client id, so one user can
# never present another user's id (no session takeover that fires the
# reader's retained "offline" will). One connection per user at a time.
use_username_as_clientid true
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
